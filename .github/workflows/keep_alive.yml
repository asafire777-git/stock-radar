name: 🔄 24/7 Smart Keep-Alive & Auto-Wakeup (Streamlit)

on:
  push:
    branches: [main]
  schedule:
    # 2시간마다 실제 브라우저(Playwright)로 방문하여 웹소켓 세션 유지 및 자동 기상
    - cron: '0 */2 * * *'
  workflow_dispatch: # 관리자 수동 즉시 실행 지원

# 동시 실행 방지
concurrency:
  group: keep-alive-streamlit
  cancel-in-progress: true

jobs:
  smart-keepalive:
    name: 🌐 Real Browser Session & Auto-Wakeup
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: .github/workflows/package.json

      - name: 📦 Install Playwright & Chromium
        working-directory: .github/workflows
        run: |
          npm ci || npm install
          npx playwright install chromium --with-deps

      - name: 🚀 Run Smart Keep-Alive & Auto-Wakeup
        run: node .github/workflows/keep_alive.js

      - name: 🛡️ Prevent GitHub Actions 60-Day Inactivity Disablement
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last Keep-Alive Ping: $(date -u)" > .github/workflows/last_ping.txt
          git add .github/workflows/last_ping.txt
          git commit -m "chore(keep-alive): heartbeat [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
